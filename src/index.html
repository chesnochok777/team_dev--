<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <!-- Подключаем отдельный CSS-файл -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Блок с конвертером -->
    <div class="converter-block">
        <h2>💱 Конвертер валют</h2>
        
        <div class="input-group">
            <label for="amount">Сумма:</label>
            <input type="number" id="amount" value="1000" min="0">
        </div>

        <div class="input-group">
            <label for="fromCurrency">Из валюты:</label>
            <select id="fromCurrency">
                <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
                <option value="USD">🇺🇸 Доллар США (USD)</option>
                <option value="JPY">🇯🇵 Японская йена (JPY)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="toCurrency">В валюту:</label>
            <select id="toCurrency">
                <option value="USD" selected>🇺🇸 Доллар США (USD)</option>
                <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
                <option value="JPY">🇯🇵 Японская йена (JPY)</option>
            </select>
        </div>

        <button id="convertBtn">Конвертировать</button>

        <div class="result" id="result">Введите сумму и нажмите кнопку</div>
    </div>

    <!-- Подключаем отдельный JS-файл -->
    <script src="script.js"></script>
</body>
</html>
